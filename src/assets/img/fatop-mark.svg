<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="FaTop Automation">
  <!--
    The M1 symbol only. The supplied artwork is a full lockup - a ten-slot wound
    stator above, then FaTop / AUTOMATION / the registered company name below.
    The wordmark is dropped here because the site header already sets the
    company name in live text beside this mark, and repeating it inside the logo
    would say it twice and make both illegible at 32px.

    The dark plate is kept rather than knocked out. The stator teeth are drawn
    in #EFF1F5, so on a light background they would disappear entirely. Keeping
    the plate is how the mark was drawn, and it survives both themes unchanged.

    The drop shadow from the source file is not carried over: at header and
    favicon sizes a 24px blur reads as fuzz rather than depth.

    The ten slots are written out rather than drawn once in <defs> and repeated
    with <use>. <use href> is SVG2 and not every renderer follows it - the first
    version of this file lost all ten slots when rasterised, leaving a plate and
    a dot. A brand mark that depends on the renderer being modern is not worth
    the few hundred bytes saved.

    Symbol centre in the source is (1000, 680) on a 2000x2000 canvas, outer
    radius ~341. Re-centred here and set at 0.92 so the teeth clear the plate
    edge. Each slot is one silicon steel tooth, one burnt orange winding block,
    and four gaps cut in the plate colour to read as turns.
  -->
  <rect width="800" height="800" rx="120" fill="#0F172A"/>

  <g transform="translate(400,400) scale(0.92)">
    <g transform="rotate(0)">
      <path d="M -16,-180 L 16,-180 L 22,-320 L -22,-320 Z" fill="#EFF1F5"/>
      <path d="M -45,-320 L 45,-320 L 45,-338 L -45,-338 Z" fill="#EFF1F5"/>
      <path d="M -35,-190 L 35,-190 L 44,-305 L -44,-305 Z" fill="#C23A00"/>
      <rect x="-50" y="-213" width="100" height="4" fill="#0F172A"/>
